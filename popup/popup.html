<html>
    <head>
        <link rel="stylesheet" href="../lib/coloris/coloris.css">
        <link rel="stylesheet" href="popup.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        
        <script src="../lib/coloris/coloris.js" defer></script>
        <script src="components.js" defer></script>
        <script src="popup.js" defer></script>
    </head>
    <body>
        <header>
            <svg viewBox="0 0 33 33" xmlns="http://www.w3.org/2000/svg" class="icon">
                <!-- Green background -->
                <path
                    fill="#1DB954"
                    d="M16.5 0A16.5 16.5 0 1 0 16.5 33A16.5 16.5 0 1 0 16.5 0Z"
                    class="icon-bg"
                />

                <!-- White pen icon -->
                <path
                    fill="#FFFFFF"
                    d="
                    M14.32 5.31
                    H15.34
                    V14.54
                    C14.97 14.92 14.79 15.43 14.79 15.96
                    C14.79 16.87 15.54 17.59 16.57 17.59
                    C17.61 17.59 18.39 16.85 18.39 15.96
                    C18.39 15.42 18.20 14.94 17.88 14.54
                    V5.31
                    H19.04
                    L23.25 17.37
                    L21.01 21.44
                    H11.99
                    L9.75 17.37
                    L14.25 5.44
                    Z

                    M12 22.02
                    H21
                    C21.34 22.40 21.53 22.85 21.53 23.25
                    C21.53 23.68 21.36 24.09 21 24.50
                    H12
                    C11.65 24.10 11.46 23.68 11.46 23.25
                    C11.46 22.82 11.68 22.41 12 22.02
                    Z
                    "
                />
            </svg>

            <h1 class="extension-name">OpenTheme</h1>
        </header>
        <div class="main">
            <div class="category">
                <h2 class="category-label">Backgrounds and surfaces</h2>
                <color-row label="Background" value="#f7f3ee" id="--theme-bg"></color-row>
                <color-row label="Surface" value="#eee8f4" id="--theme-surface"></color-row>
                <color-row label="Surface (hover)" value="#e5dded" id="--theme-surface-hover"></color-row>
                <color-row label="Surface (press)" value="#d1c2e8" id="--theme-surface-press"></color-row>
                <color-row label="Search active" value="#fbf7da" id="--theme-search-active"></color-row>
                <color-row label="Menu" value="#ffffff" id="--theme-menu"></color-row>
            </div>

            <div class="category">
                <h2 class="category-label">Text and typography</h2>
                <color-row label="Text" id="--theme-text"></color-row>
                <color-row label="Text (subdued)" id="--theme-text-subdued"></color-row>
                <color-row label="Link" id="--theme-link"></color-row>
                <color-row label="Muted" id="--theme-muted"></color-row>
                <color-row label="Playlist type" id="--theme-playlist-type"></color-row>
                <color-row label="Playlist metadata" id="--theme-playlist-meta"></color-row>
                <color-row label="Playlist description" id="--theme-playlist-description"></color-row>
                <color-row label="Column label" id="--theme-column-label"></color-row>
                <color-row label="Home icon" id="--theme-home-icon"></color-row>
                <color-row label="On image" id="--theme-on-image"></color-row>
                <color-row label="Black" id="--theme-black"></color-row>
            </div>

            <div class="category">
                <h2 class="category-label">Accents and controls</h2>
                <color-row label="Accent" value="#bfff09" id="--theme-accent"></color-row>
                <color-row label="Accent (hover)" value="#aad927" id="--theme-accent-hover"></color-row>
                <color-row label="Accent (soft)" value="#edffba" id="--theme-accent-soft"></color-row>
                <color-row label="On accent" value="#201f1c" id="--theme-on-accent"></color-row>
                <color-row label="Play icon" value="#f7ffe2" id="--theme-play-icon"></color-row>
                <color-row label="Slider handle" value="#ffffff" id="--theme-slider-handle"></color-row>
                <color-row label="Top bar" value="#bbe83b" id="--theme-topbar"></color-row>
                <color-row label="Playlist top bar" value="#eee9c4" id="--theme-playlist-topbar"></color-row>
                <color-row label="Search border" value="#ffffff1a" id="--theme-search-border"></color-row>
            </div>

            <div class="category">
                <h2 class="category-label">Lyrics</h2>
                <color-row label="Background" value="#b3ea18" id="--theme-lyrics-bg"></color-row>
                <color-row label="Active" value="#ffffff" id="--theme-lyrics-active"></color-row>
                <color-row label="Inactive" value="#ffffff" id="--theme-lyrics-inactive"></color-row>
                <color-row label="Passed" value="#ffffff" id="--theme-lyrics-passed"></color-row>
                <color-row label="Message" value="#000000" id="--theme-lyrics-message"></color-row>
            </div>

            <div class="category">
                <h2 class="category-label">Footer</h2>
                <color-row label="Background" value="#757262" id="--theme-footer-bg"></color-row>
                <color-row label="Heading" value="#ffffff" id="--theme-footer-heading"></color-row>
                <color-row label="Text" value="#e1decf" id="--theme-footer-text"></color-row>
            </div>
        </div>
        
    </body>
</html>
